name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'taarifa_frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'taarifa_frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: taarifa_frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd taarifa_frontend
          npm ci

      - name: Run lint
        run: |
          cd taarifa_frontend
          npm run lint || true

      - name: Build
        run: |
          cd taarifa_frontend
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./taarifa_frontend
          push: true
          build-args: |
            VITE_GRAPHQL_URL=https://api.yourdomain.com/graphql/
            VITE_API_URL=https://api.yourdomain.com/api/
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taarifa-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/taarifa-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/taarifa
            docker-compose pull frontend
            docker-compose up -d frontend